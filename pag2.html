<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="lista">
        <h1 class="menul">MENU</h1>
         <ul class="uele">
        <li class="lbtn"><a href="#">Início</a></li>
        <li class="lbtn"><a href="#">Perfil</a></li>
        <li class="lbtn"><a href="#">Configurações</a></li>
        <li class="lbtn"><a href="#">Sair</a></li>
    </ul>
    </div>

    <div class="bar">
<img src="elbolo.png" alt="" class="foto">
<nav class="navi">
    <li class="sbtn ativo">SSSSSS</li>
    <li class="sbtn">EEEEE</li>
    <li class="sbtn">CCCCC</li>
    <li class="sbtn">FFFFFF</li>
    <li class="sbtn">LLLLLL</li>
</nav>
<button class="entrar">Entrar-> </button>

    </div>

    <style>
html, body {
    height: 100%;
   
    margin: 0;
    overflow:hidden;
    
}
body{
    display: flex;
}
h1 {
  margin-top: 0;
  margin: 0;
  
}
.lista{
    display: flex;
    height:80vh;
    width: 10%;
    background-color: blue;
    margin-top: 20vh;
   flex-direction: column;
  
    
    
}
.uele{
    padding: 0;
    margin: 0;
    list-style: none;
width: 100%;
height:70vh ;
display: flex;
background-color: blueviolet;
flex-direction: column;
align-items: flex-start;
}
.lbtn{
 list-style: none;
    cursor: pointer;
    font-size: xx-large;
   
    
}
.lbtn a{
    color: white;
    text-decoration: none;
}
.menul {
    display: flex;
    height: 5vh;
    width: 100%;
    background-color: rgb(240, 189, 189);
    justify-content: center;
   
   
   
}
.bar {
    width: 100%;
    height: 20vh;
    background-color: brown;

    position: fixed;
    right: 0;
    top: 0;
    display: flex;
}
.foto{
    width: 10%;
    height: 20vh;
    transform: scaleX(2) scaleY(3);
    margin-top: 20px;
}
.navi{
    display: flex;
    gap: 15px;
    margin-left: 100px;
   

}
.sbtn{
    width: 160px;
    height: 70px;
    display: flex;
    background-color: aliceblue;
    margin-top: 58px;
    border-radius: 4px;
    list-style: none;
    cursor: pointer;
    align-items: center;
    justify-content: center;
    font-size: xx-large;
}
.entrar{
    width: 100px;
    height: 70px;
    background-color: rgb(255, 211, 180);
    margin-top: 58px;
    border: none;
    margin-left: 30px;
    border-radius: 4px;
    cursor: pointer;
   font-size: large;
}

.sbtn:hover{
    background-color: blueviolet;
    color: black;
}
.entrar:hover{
    background-color: chartreuse;
    color: black;
}
.sbtn.ativo{
    background-color: chocolate;
    color: white;
    
}
    </style>
</body>
</html>
